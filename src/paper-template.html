<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#075f63">
    <title>{{TITLE}}</title>
    <style>{{CSS}}</style>
  </head>
  <body data-answer-mode="locked" data-question-count="{{COUNT}}">
    <div id="app">
      <header class="topbar">
        <div>
          <h1>UPTET अभ्यास</h1>
          <p class="paper-label">{{SHORT_TITLE}}</p>
        </div>
        <div class="topbar-actions">
          <button id="review-latest-top" type="button" hidden>नवीनतम समीक्षा</button>
          <button id="home-link" type="button">पेपर चुनें</button>
        </div>
      </header>
      <main id="view-root" class="exam-shell" aria-live="polite"></main>
      <button id="submit-exam" type="button" disabled hidden>परीक्षा जमा करें</button>
    </div>
    <script id="paper-data" type="application/octet-stream">{{DATA}}</script>
    <script>{{CORE}}
{{UI}}</script>
  </body>
</html>
